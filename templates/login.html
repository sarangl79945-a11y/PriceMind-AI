{% extends "base.html" %}

{% block title %}Login | PriceMind AI{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center fw-bold mb-2">Welcome Back</h2>
                <p class="text-center text-muted mb-4">Sign in to your PriceMind AI account.</p>

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email"
                               class="form-control"
                               id="email"
                               name="email"
                               placeholder="you@example.com"
                               value="{{ email or '' }}"
                               required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               placeholder="Enter your password"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        Login
                    </button>
                </form>

                <p class="text-center text-muted mt-4 mb-0">
                    Don't have an account?
                    <a href="{{ url_for('register') }}" class="text-decoration-none">Create one</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
